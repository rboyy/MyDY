name: Build MyDY APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'adopt'

    - name: Install apktool
      run: |
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
        echo '#!/bin/bash' > /usr/local/bin/apktool
        echo 'java -jar /usr/local/bin/apktool.jar "$@"' >> /usr/local/bin/apktool
        chmod +x /usr/local/bin/apktool
        apktool --version

    - name: Build APK
      run: apktool b decompiled -o app-release-unsigned.apk

    - name: Generate debug keystore and sign APK
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android app-release-unsigned.apk androiddebugkey
        zipalign -v 4 app-release-unsigned.apk MyDY-release.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: MyDY-release
        path: MyDY-release.apk