name: Build MyDY APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Java
      uses: actions/setup-java@v4.5.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y wget unzip

    - name: Install apktool
      run: |
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /home/runner/apktool.jar
        echo '#!/bin/bash' > /home/runner/apktool
        echo 'java -jar /home/runner/apktool.jar "$@"' >> /home/runner/apktool
        chmod +x /home/runner/apktool

    - name: Install uber-apk-signer (Java based)
      run: |
        wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O /home/runner/uber-apk-signer.jar

    - name: Build APK
      run: |
        /home/runner/apktool b decompiled -o app-release-unsigned.apk
        ls -la app-release-unsigned.apk

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

    - name: Sign and align APK with uber-apk-signer
      run: |
        java -jar /home/runner/uber-apk-signer.jar --apks app-release-unsigned.apk --ks debug.keystore --ksKeyPass android --ksPass android --alias androiddebugkey --out . 2>&1
        echo "=== All files after signing ==="
        ls -la *.apk 2>/dev/null || echo "No APK files found"
        ls -la

    - name: Find and rename signed APK
      run: |
        echo "=== Searching for signed APK ==="
        find . -name "*.apk" -type f
        SIGNED_APK=$(find . -name "*.apk" -type f ! -name "app-release-unsigned.apk" | head -1)
        if [ -n "$SIGNED_APK" ]; then
          echo "Found signed APK: $SIGNED_APK"
          mv "$SIGNED_APK" MyDY-release.apk
          ls -la MyDY-release.apk
        else
          echo "ERROR: Signed APK not found!"
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4.3.4
      with:
        name: MyDY-release
        path: MyDY-release.apk

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2.0.8
      with:
        tag_name: v1.2.${{ github.run_number }}
        name: MyDY v1.2.${{ github.run_number }}
        body: |
          Automatic build from GitHub Actions
          - Build: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: MyDY-release.apk