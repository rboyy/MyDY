name: Build MyDY APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Java
      uses: actions/setup-java@v4.5.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y wget unzip

    - name: Install apktool
      run: |
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /home/runner/apktool.jar
        echo '#!/bin/bash' > /home/runner/apktool
        echo 'java -jar /home/runner/apktool.jar "$@"' >> /home/runner/apktool
        chmod +x /home/runner/apktool

    - name: Install uber-apk-signer
      run: |
        wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O /home/runner/uber-apk-signer.jar

    - name: Build APK
      run: |
        /home/runner/apktool b decompiled -o app-release-unsigned.apk
        ls -la app-release-unsigned.apk

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Sign and align APK with uber-apk-signer
      run: |
        java -jar /home/runner/uber-apk-signer.jar --apks app-release-unsigned.apk --ks debug.keystore --ksKeyPass android --ksPass android --alias androiddebugkey --out . 2>&1
        echo "=== Generated files ==="
        ls -la

    - name: Find and rename signed APK
      run: |
        SIGNED_APK=$(find . -name "*signed*.apk" -o -name "*aligned*.apk" | head -1)
        if [ -n "$SIGNED_APK" ]; then
          echo "Found signed APK: $SIGNED_APK"
          mv "$SIGNED_APK" MyDY-release.apk
          ls -la MyDY-release.apk
        else
          echo "ERROR: Signed APK not found!"
          exit 1
        fi

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4.3.4
      with:
        name: MyDY-release
        path: MyDY-release.apk