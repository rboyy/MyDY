name: Build MyDY APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Java
      uses: actions/setup-java@v4.5.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y wget unzip

    - name: Install apktool
      run: |
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /home/runner/apktool.jar
        echo '#!/bin/bash' > /home/runner/apktool
        echo 'java -jar /home/runner/apktool.jar "$@"' >> /home/runner/apktool
        chmod +x /home/runner/apktool

    - name: Build APK
      run: |
        /home/runner/apktool b decompiled -o app-release-unsigned.apk
        ls -la app-release-unsigned.apk

    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
        keytool -list -v -keystore debug.keystore -storepass android

    - name: Sign APK directly with jarsigner
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android app-release-unsigned.apk androiddebugkey
        jarsigner -verify -verbose app-release-unsigned.apk

    - name: Install Android SDK Build Tools
      run: |
        wget -q https://dl.google.com/android/repository/build-tools_r30.0.3-linux.zip -O /tmp/build-tools.zip
        unzip -q /tmp/build-tools.zip -d /tmp/build-tools-extracted
        ls -la /tmp/build-tools-extracted/

    - name: Install libc++ for zipalign
      run: |
        sudo apt-get install -y libc++1

    - name: Align APK with zipalign
      run: |
        ZIPALIGN_PATH=$(find /tmp/build-tools-extracted -name "zipalign" -type f)
        echo "Found zipalign: $ZIPALIGN_PATH"
        chmod +x "$ZIPALIGN_PATH"
        "$ZIPALIGN_PATH" -v 4 app-release-unsigned.apk MyDY-release.apk
        "$ZIPALIGN_PATH" -c -v 4 MyDY-release.apk
        ls -la MyDY-release.apk

    - name: Verify final APK
      run: |
        jarsigner -verify -verbose MyDY-release.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4.3.4
      with:
        name: MyDY-release
        path: MyDY-release.apk

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2.0.8
      with:
        tag_name: v1.2.${{ github.run_number }}
        name: MyDY v1.2.${{ github.run_number }}
        body: |
          Automatic build from GitHub Actions
          - Build: ${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: MyDY-release.apk