name: Build MyDY APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Set up Java
      uses: actions/setup-java@v4.5.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y wget unzip

    - name: Install apktool
      run: |
        wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /home/runner/apktool.jar
        echo '#!/bin/bash' > /home/runner/apktool
        echo 'java -jar /home/runner/apktool.jar "$@"' >> /home/runner/apktool
        chmod +x /home/runner/apktool

    - name: Install zipalign
      run: |
        wget -q https://dl.google.com/android/repository/build-tools_r33-linux.zip -O /tmp/build-tools.zip
        unzip -q /tmp/build-tools.zip -d /tmp/build-tools-extracted
        ls -la /tmp/build-tools-extracted/
        ZIPALIGN_PATH=$(find /tmp/build-tools-extracted -name "zipalign" -type f)
        echo "Found zipalign at: $ZIPALIGN_PATH"
        cp "$ZIPALIGN_PATH" /home/runner/zipalign
        chmod +x /home/runner/zipalign

    - name: Build APK
      run: /home/runner/apktool b decompiled -o app-release-unsigned.apk

    - name: Generate debug keystore and sign APK
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android app-release-unsigned.apk androiddebugkey
        /home/runner/zipalign -v 4 app-release-unsigned.apk MyDY-release.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4.3.4
      with:
        name: MyDY-release
        path: MyDY-release.apk